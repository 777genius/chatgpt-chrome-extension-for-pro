<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Журнал ChatGPT</title>
<style>body{font:14px system-ui;margin:32px;background:#151515;color:#eee}h1{font-size:24px}p{color:#bbb}button,input{font:inherit;border:1px solid #777;border-radius:6px;padding:9px;background:#252525;color:#eee}input{width:360px}header{display:flex;gap:12px;flex-wrap:wrap;align-items:center}article{border-bottom:1px solid #444;padding:12px 0}summary{cursor:pointer;line-height:1.7}small{color:#bbb}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#222;padding:14px}a{color:#95c8ff}#status{white-space:pre-wrap}.error{color:#ff9999}</style></head>
<body><h1>Журнал ChatGPT</h1><p>Хранится только в этом Chrome. Полный текст автоматических сообщений, ID чатов и этапы отправки сохраняются без автоматического удаления. Запрос сам по себе не подтверждает доставку.</p>
<header><input id="filter" placeholder="ID чата, название, ID операции или событие" aria-label="Поиск в журнале"><button id="refresh">Обновить</button><button id="export">Скачать полный журнал JSON</button></header>
<p id="status"></p><main id="events"></main><button id="more" hidden>Показать ещё 200</button><script src="journal.js"></script></body></html>
