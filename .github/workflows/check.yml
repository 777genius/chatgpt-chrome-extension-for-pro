name: Checks
on:
  push:
    branches:
      - main
      # Temporary draft-only opt-in CI lane; removed before merge.
      - refactor/typescript-bun-modular
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref != 'refs/heads/main' && !contains(github.event.head_commit.message, '[ci:test]') && github.sha) || github.ref }}
  cancel-in-progress: true
jobs:
  check:
    # Draft pushes run the expensive gate only with a deliberate [ci:test] commit.
    # Ready PRs and main always run the complete gate; dispatch remains explicit.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && !github.event.pull_request.draft) || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || contains(github.event.head_commit.message, '[ci:test]')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.3'
      - name: Install dependencies (draft migration may generate a lock)
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == "refs/heads/main" || "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            test -f bun.lock || { echo "Frozen Bun lockfile required for a ready PR/main"; exit 1; }
            bun install --frozen-lockfile
          else
            bun install
          fi
      - name: Save generated Bun lock for the draft transition
        if: github.event_name == 'push' && github.ref != 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: bun-lock-candidate
          path: bun.lock
          if-no-files-found: error
      - name: Capture draft source for isolated non-browser review
        if: github.event_name == 'push' && github.ref != 'refs/heads/main'
        shell: bash
        run: |
          tar --exclude=.git --exclude=node_modules --exclude=dist --exclude=coverage \
            -czf "$RUNNER_TEMP/source-candidate.tar.gz" .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.event_name == 'push' && github.ref != 'refs/heads/main'
        with:
          name: source-candidate
          path: ${{ runner.temp }}/source-candidate.tar.gz
          if-no-files-found: error
      - run: bun run check
