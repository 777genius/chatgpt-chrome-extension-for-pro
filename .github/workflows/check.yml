name: Checks
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
concurrency:
  group: checks-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Verify Chrome Web Store ZIP (clean checkout)
        run: |
          npm run package:store -- --out "$RUNNER_TEMP/store-first.zip"
          npm run package:store -- --out "$RUNNER_TEMP/store-second.zip"
          cmp "$RUNNER_TEMP/store-first.zip" "$RUNNER_TEMP/store-second.zip"
          unzip -t "$RUNNER_TEMP/store-first.zip"
