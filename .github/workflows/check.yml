name: Checks
on:
  push:
    branches:
      - main
      # Temporary draft-only opt-in CI lane; removed before merge.
      - refactor/typescript-bun-modular
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.event.pull_request.number || (github.event_name == 'push' && github.ref != 'refs/heads/main' && !contains(github.event.head_commit.message, '[ci:test]') && github.sha) || github.ref }}
  cancel-in-progress: true
jobs:
  check:
    # Draft pushes run the expensive gate only with a deliberate [ci:test] commit.
    # Ready PRs and main always run the complete gate; dispatch remains explicit.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && !github.event.pull_request.draft) || (github.event_name == 'push' && (github.ref == 'refs/heads/main' || contains(github.event.head_commit.message, '[ci:test]')))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: '1.4.3'
      - name: Install frozen Bun dependencies
        run: bun install --frozen-lockfile
      # Temporary, opt-in draft diagnostic bundle. No credentials are added.
      # Lets us run TS7/type and synthetic E2E offline while Actions is queued.
      - name: Save offline draft toolchain candidate
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[ci:test]')
        shell: bash
        run: |
          tar --exclude=.git --exclude=dist --exclude=coverage \
            -czf "$RUNNER_TEMP/draft-toolchain.tar.gz" .
          # Preserve the exact upstream baseline and Bun runner tool for
          # independent local migration/parity diagnostics. No git credentials
          # or developer profile files enter these archives.
          git fetch --no-tags --depth=1 origin main
          git archive FETCH_HEAD | gzip -9 > "$RUNNER_TEMP/main-source.tar.gz"
          cp "$(command -v bun)" "$RUNNER_TEMP/bun-linux-x64"
      - name: Upload draft offline candidate
        if: github.event_name == 'push' && contains(github.event.head_commit.message, '[ci:test]')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: draft-toolchain-${{ github.sha }}
          path: |
            ${{ runner.temp }}/draft-toolchain.tar.gz
            ${{ runner.temp }}/main-source.tar.gz
            ${{ runner.temp }}/bun-linux-x64
          if-no-files-found: error
          retention-days: 1
      - run: bun run check
      - name: Reject incomplete migration before draft qualification, ready/main
        if: github.ref == 'refs/heads/main' || (github.event_name == 'pull_request' && !github.event.pull_request.draft) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[ci:test]'))
        run: bun run check:complete
      # Download the exact tested unpacked build for the owner's final Chrome
      # smoke test. Never publish an unqualified Draft or failed build.
      - name: Preserve qualified Chrome MV3 distribution
        if: github.event_name == 'pull_request' && !github.event.pull_request.draft && success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: chrome-mv3-${{ github.sha }}
          path: dist/extension/
          if-no-files-found: error
          retention-days: 7
